[options]
# Fichier de référence pour le module FNE.
# La configuration réellement utilisée par le serveur est ../etc/odoo.conf
# (ou ../etc/odoo18.conf pour le stack de test Odoo 18).

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = admin

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

# Journalisation : le logger du module porte le nom technique du dossier,
# soit odoo.addons.module_invoice_fne_v19.
log_level = info
log_handler = [':INFO', 'odoo.addons.module_invoice_fne_v19:DEBUG']
logfile = /var/lib/odoo/odoo-server.log

http_port = 8069
max_cron_threads = 1
